{% set name = "opentelemac" %}
{% set version = "v9.1.1" %}
{% set build = 1 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://gitlab.pam-retd.fr/otm/telemac-mascaret/-/archive/{{ version }}/telemac-mascaret-{{ version }}.tar.gz
    folder: opentelemac
    sha256: 194e37997207295b639dbcf184e711797fd19075a64e0d3481b6246af5d9ede5

build:
  number: {{ build }}
  skip: true  # [win]
  missing_dso_whitelist:
    - '*/libc.so.6'
    - '*/libpthread.so.0'
    - '*/libm.so.6'
  ignore_run_exports_from:
    - {{ compiler('cxx') }}
  ignore_run_exports:
    - numpy
  rpaths:
    - opentelemac/lib

requirements:
  build:
    - cross-python_{{ target_platform }}    # [build_platform != target_platform]
    - python                                # [build_platform != target_platform]
    - numpy                                 # [build_platform != target_platform]
    - openmpi                               # [build_platform != target_platform]
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >3.30
    - make                                  # [unix]
  host:
    - openmpi
    - metis
    - python
    - numpy
    - cmake >3.30
  run:
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - openmpi
    - python
    - numpy
    - metis
    - matplotlib-base
    - scipy
    - mpi4py
    - cmake >3.30

test:
  commands:
    - config.py

about:
  home: http://www.opentelemac.org/
  license: GPL-3.0-or-later
  license_file: opentelemac/LICENSE.txt
  summary: openTelemac
  description: |
    The TELEMAC-MASCARET system is an integrated suite of solvers for use in the
    field of free-surface flow.
  doc_url: http://wiki.opentelemac.org/doku.php?id=documentation_{{ version }}
  dev_url: https://gitlab.pam-retd.fr/otm/telemac-mascaret/

extra:
  recipe-maintainers:
    - nicogodet
    - tomsail
